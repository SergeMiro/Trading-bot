[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "trading-bot"
version = "0.1.0"
description = "Multi-agent earnings trading bot"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "psycopg2-binary>=2.9,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "apscheduler>=3.10,<4.0",
    "httpx>=0.28,<1.0",
    "openai>=1.60,<2.0",
    "yfinance>=0.2,<1.0",
    "ib_insync>=0.9,<1.0",
    "structlog>=24.0",
    "tenacity>=9.0,<10.0",
    "pytz>=2024.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
