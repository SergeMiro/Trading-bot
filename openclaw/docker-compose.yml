# ═══════════════════════════════════════════════════════════════
# Trading Bot v2 — Docker Compose
# Services: PostgreSQL, SEC RSS Monitor
# OpenClaw Gateway runs natively on host (not in Docker)
# ═══════════════════════════════════════════════════════════════

version: "3.9"

services:

  # ─── PostgreSQL Database ────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: trading-bot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trading_bot}
      POSTGRES_USER: ${POSTGRES_USER:-trading_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading_bot_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trading_bot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading-net

  # ─── SEC RSS Monitor (long-running process) ────────────────
  sec-rss-monitor:
    build:
      context: .
      dockerfile: Dockerfile.scripts
    container_name: trading-bot-sec-rss
    restart: unless-stopped
    command: python3 /app/scripts/sec_rss_monitor.py --interval 900
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-trading_bot}:${POSTGRES_PASSWORD:-trading_bot_pass}@postgres:5432/${POSTGRES_DB:-trading_bot}
      - SEC_USER_AGENT=${SEC_USER_AGENT:-trading-bot contact@youremail.com}
      - OPENCLAW_WEBHOOK_URL=http://host.docker.internal:3000/webhook/sec-events
      - OPENCLAW_WEBHOOK_SECRET=${OPENCLAW_WEBHOOK_SECRET:-}
      - SEC_POLL_INTERVAL=900
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trading-net

  # ─── Grafana (optional monitoring dashboard) ────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: trading-bot-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-trading_bot}
      GF_INSTALL_PLUGINS: grafana-postgresql-datasource
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trading-net
    profiles:
      - monitoring  # Only start with: docker compose --profile monitoring up

volumes:
  postgres_data:
    driver: local
  grafana_data:
    driver: local

networks:
  trading-net:
    driver: bridge
